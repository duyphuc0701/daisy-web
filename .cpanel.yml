---
deployment:
  tasks:
    - "/bin/bash -c 'rm -rf /home/sdytkgxn/public_html/assets'"
    - "/bin/bash -c 'rm -f /home/sdytkgxn/public_html/index.html'"
    - "/bin/bash -c 'rm -f /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'cp -R frontend/dist/. /home/sdytkgxn/public_html/'"
    - "/bin/bash -c 'find /home/sdytkgxn/nodeapps/daisy-backend -mindepth 1 -maxdepth 1 ! -name node_modules ! -name tmp ! -name .env -exec rm -rf {} +'"
    - "/bin/bash -c 'cp -R backend/. /home/sdytkgxn/nodeapps/daisy-backend/'"
    - "/bin/bash -c 'echo \"<IfModule mod_rewrite.c>\" > /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteEngine On\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteBase /\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteRule ^index\\.html$ - [L]\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteCond %{REQUEST_FILENAME} !-f\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteCond %{REQUEST_FILENAME} !-d\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteCond %{REQUEST_FILENAME} !-l\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteCond %{REQUEST_URI} !^/api\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"  RewriteRule . /index.html [L]\" >> /home/sdytkgxn/public_html/.htaccess'"
    - "/bin/bash -c 'echo \"</IfModule>\" >> /home/sdytkgxn/public_html/.htaccess'"